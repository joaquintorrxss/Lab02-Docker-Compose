services:
  api1:
    build: ./api
    ports:
      - "3000:3000"
    environment:
      - MESSAGE=${MESSAGE}
    depends_on:
      - db

  api2:
    build: ./api
    ports:
      - "3001:3000"
    environment:
      - MESSAGE=${MESSAGE}
    depends_on:
      - db

  api3:
    build: ./api
    ports:
      - "3002:3000"
    environment:
      - MESSAGE=${MESSAGE}
    depends_on:
      - db

  db:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: